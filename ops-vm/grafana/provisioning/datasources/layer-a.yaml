# Shared (Layer A) instance datasources ONLY.
# The people datasource is NEVER registered here - it exists only in the
# separately credentialed Founder-only instance (D75, AT-097, Section 90).
#
# FD-112/PFD-032 (2026-09-08): DevLake is deferred from V1 scope. No devlake
# datasource is provisioned here. Re-adding it is gated on the trigger
# recorded in contracts/v1-scope.yaml (devlake.trigger: to_be_determined_by_L0).
apiVersion: 1
datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
