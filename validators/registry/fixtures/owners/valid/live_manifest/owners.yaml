registry_version: 1

# Transcribed from the Section 52.6 Owner column. Section 52.6 states the
# inventory is twenty-nine entries; the table body names thirty artifacts on
# twenty-nine lines, because the Conduct-records store row and the templates/
# row share a line. Both numbers are recorded so the guard at L1-704 fires on
# the discrepancy rather than hiding it. See the L1-505 blocker.
declared_count: 29

artifacts:
  - path: product.yaml
    owner: primary_owner
    per_entry_owner: false
    repository: product
    purpose: "The Product Operating Contract"
  - path: verification/contract.yaml
    owner: qa
    per_entry_owner: false
    repository: product
    purpose: "Verification truth: mechanisms, requirement mapping, auto-pass scope"
  - path: registries/services/*/service.yaml
    owner: service_owner
    per_entry_owner: false
    repository: control-plane
    purpose: "Shared-service contract and dependency declaration"
  - path: registries/people.yaml
    owner: founder
    per_entry_owner: false
    repository: control-plane
    purpose: "Authoritative people, employment, capability and availability state"
  - path: registries/roles.yaml
    owner: founder
    per_entry_owner: false
    repository: control-plane
    purpose: "Role registry"
  - path: registries/topology.yaml
    owner: founder
    per_entry_owner: false
    repository: control-plane
    purpose: "Domains, Team Lead scopes, succession designations, escalation resolution"
  - path: registries/platform.yaml
    owner: team_lead
    per_entry_owner: false
    repository: control-plane
    purpose: "Operating-system version, supported contract versions, workflow versions, canary set, event_type enum"
  - path: registries/os-health.yaml
    owner: team_lead
    per_entry_owner: false
    repository: control-plane
