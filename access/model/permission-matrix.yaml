# access/model/permission-matrix.yaml
# Spec Section 90.2 (spec lines 7951-7984), transcribed verbatim from
# C:/D_Drive/PS/MultiProduct/Research/MultiProduct_MasterSpec_v4.0.md.
# The Layer A/B data-category permission matrix: who may see what about
# people. `rows` holds the twenty-six data-category rows in the exact order
# the table prints them. The machine-identities row is held separately as
# `machine_identity_row` because Section 90.2 states it is absolute -- it is
# never merged into the four-column table it stands beneath.
document: permission-matrix
spec_sections: ["90.1", "90.2"]
decisions: []

columns: ["founder", "team_lead", "employee", "peer"]

rows:
