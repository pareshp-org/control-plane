machine_identity_row:
  data_category: >-
    Every people-related category above, for machine identities (reconciler,
    provisioning CLI, ops console, background agents)
  founder: "No"
  team_lead: "No"
  employee: "No"
  peer: "No"
  absolute: true
  machine_identities:
    - reconciler
    - provisioning-cli
    - ops-console
    - background-agents
    - background-machine-layer
  rationale: >-
    Section 90.2: "no machine identity holds any people-related data category,
    receives a Layer B credential or folder scope, or holds the
    people-intelligence capability, under any configuration. People
    intelligence is never relayed over messaging surfaces. The Layer B
    operating session (Section 89.1) does not breach this row: generation
    runs under the Founder's own identity in a credentialed session, never
    under a machine identity."
