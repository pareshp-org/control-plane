# Owner: Team Lead (Section 52.6). The register is deliberately thin: it
# exists to prevent fossils, not to create a tool lifecycle bureaucracy
# (Section 62.2). Entries are captured from the estate by the owner, not
# authored by Lane 1 (L1-606/L1-938).
#
# The three hermes-* entries below register the real nousresearch/hermes-agent
# checkout pinned at C:\D_Drive\PS\MultiProduct\estate\hermes-agent, tag
# v2026.9.14 (commit 345cd2b057a452236de401d3534b8502a7465e8d), per D69
# ("tools.yaml, registered before first use... has no owning lane") and
# Section 62.1's verbatim three-entry shape (lanes/L1-02-schemas.md fixture).
# `owner: founder` reflects D69's own framing ("the founder ops console");
# reconcile to a real registries/people.yaml id once the roster is seeded --
# do not treat this as a stand-in for any other person.
# Activation is still gated: the CPU benchmark go/park decision (BT-2/S2,
# spec Sec 98.2 Phase 3) has not been run, and per invariant 85/D69/D80 the
# checkout's own self-update path (`hermes update`) must never be invoked --
# version bumps happen only by editing current_version here after a reviewed
# re-pin.
#
# gsd registers the real open-gsd/gsd-core project (the plan-checker /
# spec-driven dev workflow behind subsystem G -- G-F7's "a first plan passes
# the plan-checker and is approved at Gate 1"), pinned at
# C:\D_Drive\PS\MultiProduct\estate\gsd-core, tag v1.9.1 (commit
# 957ebd8e6c62201ce7a44d49bfa92a1c0807cc25). The original repo this replaced,
# gsd-build/get-shit-done, is archived (2026-06-26) and migrated to gsd-core --
# there is one live tool here, not two. GSD distributes via npm rather than a
# binary self-update path; "no auto-update" below means no CI/task ever runs
# `npm update`/`npx gsd@latest` against a version this field doesn't already
# name.
